/* ===== 第9題：AI智慧人生模擬器｜完整權衡版 ===== */
.life-board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;height:100%;min-height:0}
.life-left,.life-right{min-height:0;background:#fff;border:1px solid #dbeafe;border-radius:22px;box-shadow:0 8px 20px rgba(15,23,42,.04);padding:14px;display:flex;flex-direction:column;overflow:hidden}

.life-placed{min-height:34px;background:#2563eb;color:#fff;border-radius:12px;padding:7px 8px;margin-bottom:6px;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:6px;animation:pop .2s ease}
.life-placed button{width:20px;height:20px;border:0;border-radius:7px;background:rgba(255,255,255,.25);color:#fff;cursor:pointer;font-weight:900;line-height:1}

.fridge-door-wrap{

}
.fridge-unit{

let coverUnlocked=false;
let coverStartY=null;
let coverStartX=null;

function unlockCover(){
  if(coverUnlocked)return;
  coverUnlocked=true;
  const cover=document.getElementById('lockCover');
  const screen=document.querySelector('.screen');
  if(screen)screen.classList.remove('locked');
  if(cover){
    cover.classList.add('unlocking');
    setTimeout(()=>{ if(cover && cover.parentNode) cover.parentNode.removeChild(cover); },850);
  }
}

function bindCoverUnlock(){
  const cover=document.getElementById('lockCover');
  const unlock=document.getElementById('unlockArea');
  const targets=[cover,unlock].filter(Boolean);
  targets.forEach(el=>{
    el.addEventListener('click',unlockCover);
    el.addEventListener('pointerdown',e=>{coverStartY=e.clientY;coverStartX=e.clientX;},{passive:true});
    el.addEventListener('pointerup',e=>{
      if(coverStartY===null)return;
      const dy=coverStartY-e.clientY;
      const dx=Math.abs((coverStartX||0)-e.clientX);
      if(dy>25 && dx<160)unlockCover();
      coverStartY=null;coverStartX=null;
    },{passive:true});
    el.addEventListener('touchstart',e=>{ if(e.touches&&e.touches[0]){coverStartY=e.touches[0].clientY;coverStartX=e.touches[0].clientX;} },{passive:true});
    el.addEventListener('touchend',e=>{
      if(coverStartY===null || !e.changedTouches || !e.changedTouches[0])return;
      const dy=coverStartY-e.changedTouches[0].clientY;
      const dx=Math.abs((coverStartX||0)-e.changedTouches[0].clientX);
      if(dy>25 && dx<160)unlockCover();
      coverStartY=null;coverStartX=null;
    },{passive:true});
  });
}

window.addEventListener('DOMContentLoaded',()=>{
  bindCoverUnlock();
});

render();


const __feedbackObserver = new MutationObserver(()=>{

});

window.addEventListener('load',()=>{
  const fb=document.getElementById('feedback');
  if(fb){
    __feedbackObserver.observe(fb,{attributes:true,attributeFilter:['class']});
  }
});

</script>

<script id="instant-feedback-toast-script-v27">
(function(){
  function ensureToast(){
    let t=document.getElementById('instantFeedbackToast');
    if(!t){
      t=document.createElement('div');
      t.id='instantFeedbackToast';
      t.className='instant-feedback-toast';
      document.body.appendChild(t);
    }
    return t;
  }

  window.showInstantFeedback = function(message,isGood){
    const fb=document.getElementById('feedback');
    if(fb){
      fb.className='feedback show '+(isGood?'good':'bad');
      fb.innerHTML=message;
    }

    const toast=ensureToast();
    toast.className='instant-feedback-toast show '+(isGood?'good':'bad');
    toast.innerHTML=message;

    clearTimeout(window.__instantFeedbackTimer);
    window.__instantFeedbackTimer=setTimeout(()=>{
      toast.classList.remove('show');
    },5200);

    // 第3題或拖拉題有時回饋區在下方，這裡直接讓學生看到回饋。
    requestAnimationFrame(()=>{
      if(fb){
        try{fb.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){}
      }
    });
  };

  // 讓任何程式只要把 #feedback 顯示出來，也會同步跳出浮動回饋。
  window.addEventListener('load',()=>{
    const fb=document.getElementById('feedback');
    if(!fb) return;
    const obs=new MutationObserver(()=>{
      if(fb.classList.contains('show') && fb.textContent.trim()){
        const isGood=fb.classList.contains('good');
        const toast=ensureToast();
        toast.className='instant-feedback-toast show '+(isGood?'good':'bad');
        toast.innerHTML=fb.innerHTML;
        clearTimeout(window.__instantFeedbackTimer);
        window.__instantFeedbackTimer=setTimeout(()=>toast.classList.remove('show'),5200);
      }
    });
    obs.observe(fb,{attributes:true,childList:true,subtree:true,attributeFilter:['class']});
  });
})();
</script>

<script id="toast-only-strong-script-v32">
(function(){
  function getToast(){
    let t=document.getElementById('instantFeedbackToast');
    if(!t){
      t=document.createElement('div');
      t.id='instantFeedbackToast';
      t.className='instant-feedback-toast';
      document.body.appendChild(t);
    }
    return t;
  }

  function hideInlineFeedback(){
    const fb=document.getElementById('feedback');
    if(!fb) return;
    fb.style.setProperty('display','none','important');
    fb.style.setProperty('visibility','hidden','important');
    fb.style.setProperty('opacity','0','important');
    fb.style.setProperty('height','0','important');
    fb.style.setProperty('min-height','0','important');
    fb.style.setProperty('max-height','0','important');
    fb.style.setProperty('margin','0','important');
    fb.style.setProperty('padding','0','important');
    fb.style.setProperty('border','0','important');
    fb.style.setProperty('overflow','hidden','important');
  }

  function stripHtml(html){
    const tmp=document.createElement('div');
    tmp.innerHTML=html || '';
    return tmp.textContent.trim();
  }

  window.showToastOnlyFeedbackV32=function(message,isGood){
    const title=document.getElementById('qTitle')?.textContent || '';
    if(title.includes('第9題')) return; // 第9題保留AI診斷報告

    const toast=getToast();
    const msg=(message || '').trim();
    if(!stripHtml(msg)) return;

    toast.className='instant-feedback-toast show '+(isGood?'good':'bad');
    toast.innerHTML=msg;

    clearTimeout(window.__toastOnlyTimerV32);
    window.__toastOnlyTimerV32=setTimeout(()=>{
      toast.classList.remove('show');
    },5200);

    hideInlineFeedback();
  };

  function showFromFeedback(){
    const title=document.getElementById('qTitle')?.textContent || '';
    if(title.includes('第9題')) return;

    const fb=document.getElementById('feedback');
    if(!fb) return;

    const html=fb.innerHTML || '';
    const txt=stripHtml(html);
    const isGood=fb.classList.contains('good');

    hideInlineFeedback();

    if(txt){
      window.showToastOnlyFeedbackV32(html,isGood);
    }
  }

  // 任何選項、完成、檢查、送出後，都立刻讀取原本回饋文字並改成 toast
  document.addEventListener('click',function(e){
    const target=e.target;
    const opt=target.closest?.('.option');
    const btn=target.closest?.('button');

    const usefulButton = btn && /完成|檢查|送出|確認|付款|收納|排序|提交|下一題/.test(btn.textContent || '');

    if(opt || usefulButton){
      setTimeout(showFromFeedback,60);
      setTimeout(showFromFeedback,180);
      setTimeout(showFromFeedback,360);
    }
  },true);

  // feedback 文字或 class 一變，也轉成 toast
  window.addEventListener('load',()=>{
    hideInlineFeedback();

    const fb=document.getElementById('feedback');
    if(fb){
      const obs=new MutationObserver(()=>{
        setTimeout(showFromFeedback,20);
      });
      obs.observe(fb,{attributes:true,childList:true,subtree:true,attributeFilter:['class','style']});
    }

    // 每次題目重繪後再次隱藏
    const root=document.querySelector('.screen') || document.body;
    const rootObs=new MutationObserver(()=>hideInlineFeedback());
    rootObs.observe(root,{childList:true,subtree:true});
  });

  // 覆寫舊的 showInstantFeedback，避免它又捲到頁面或顯示內嵌框
  window.showInstantFeedback=function(message,isGood){
    window.showToastOnlyFeedbackV32(message,isGood);
  };
})();
</script>


<script id="q4-q6-q9-final-fix-v33">
(function(){

  function currentTitle(){
    return document.getElementById('qTitle')?.textContent || '';
  }

  function currentQuestionIndex(){
    const title=currentTitle();
    const m=title.match(/第(\d+)題/);
    return m ? Number(m[1]) : null;
  }

  function forceTop(){
    const screen=document.querySelector('.screen');
    const panel=document.querySelector('.question-panel');
    const main=document.querySelector('.main');
    const options=document.getElementById('options');

    [screen,panel,main,options,document.documentElement,document.body].forEach(el=>{
      if(el && typeof el.scrollTop === 'number') el.scrollTop = 0;
    });

    window.scrollTo(0,0);
  }

  function enableNextButton(){
    const next=document.getElementById('nextBtn');
    if(!next) return;
    next.disabled=false;
    next.removeAttribute('disabled');
    next.classList.add('ready');
    next.style.pointerEvents='auto';
    next.style.cursor='pointer';
  }

  function showToast(message,isGood){
    if(window.showToastOnlyFeedbackV32){
      window.showToastOnlyFeedbackV32(message,isGood);
    }else if(window.showInstantFeedback){
      window.showInstantFeedback(message,isGood);
    }else{
      alert(message.replace(/<[^>]+>/g,''));
    }
  }

  // 第4題：選到正確餐點後，確保可送出/下一題
  function fixQ4Submit(){
    const title=currentTitle();
    if(!title.includes('第4題')) return;

    const opts=[...document.querySelectorAll('.option')];
    const selected=opts.filter(o=>o.classList.contains('selected'));

    // 雞肉捲餅 + 無糖豆漿
    const hasWrap=selected.some(o=>/雞肉捲餅/.test(o.textContent));
    const hasSoy=selected.some(o=>/無糖豆漿/.test(o.textContent));

    if(hasWrap && hasSoy && selected.length===2){
      enableNextButton();
      showToast('搭配正確：雞肉捲餅＋無糖豆漿同時符合預算、糖分、蛋白質與熱量限制。',true);
    }else if(selected.length>=2){
      enableNextButton();
      showToast('搭配還不完整：請同時檢查預算、糖分、蛋白質與熱量限制，不是看起來健康就一定正確。',false);
    }
  }

  // 第6題：按檢查排序後，不讓按鈕失效；排序正確或已檢查都可繼續
  function fixQ6SubmitByButton(btn){
    const title=currentTitle();
    if(!title.includes('第6題')) return;

    const label=btn?.textContent || '';
    if(!/檢查|排序|完成|送出/.test(label)) return;

    setTimeout(()=>{
      enableNextButton();

      const fb=document.getElementById('feedback');
      const html=fb && fb.textContent.trim()
        ? fb.innerHTML
        : '已完成排序檢查：優先處理睡眠與作息問題，會比短暫提神更能真正恢復疲勞。';

      const isGood=fb ? fb.classList.contains('good') : true;
      showToast(html,isGood);
    },120);
  }

  // 進入第9題時強制回上方，而且連續執行幾次避免被原本程式又拉到底部
  function fixQ9Top(){
    const title=currentTitle();
    if(!title.includes('第9題')) return;

    [0,60,160,320,650].forEach(t=>{
      setTimeout(forceTop,t);
    });
  }

  // 攔截點擊
  document.addEventListener('click',function(e){
    const opt=e.target.closest?.('.option');
    const btn=e.target.closest?.('button');

    if(opt){
      setTimeout(fixQ4Submit,80);
      setTimeout(fixQ9Top,120);
    }

    if(btn){
      fixQ6SubmitByButton(btn);

      // 下一題/上一題切換後檢查第9題定位
      if(/下一題|上一題/.test(btn.textContent || '')){
        [120,260,520].forEach(t=>setTimeout(fixQ9Top,t));
      }
    }
  },true);

  // 包一層 renderQuestion，題目重繪後修正
  window.addEventListener('load',()=>{
    const oldRender=window.renderQuestion;
    if(typeof oldRender==='function' && !oldRender.__v33Wrapped){
      const wrapped=function(){
        const result=oldRender.apply(this,arguments);
        setTimeout(fixQ4Submit,80);
        setTimeout(fixQ9Top,80);
        return result;
      };
      wrapped.__v33Wrapped=true;
      window.renderQuestion=wrapped;
    }

    // 初始也檢查
    setTimeout(fixQ9Top,200);
  });

})();
</script>
